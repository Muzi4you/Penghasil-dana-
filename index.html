<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Acak & Labirin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #222; color: white; text-align: center; padding: 20px; }
        h1 { color: #4ade80; margin-bottom: 15px; }
        .info-atas {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        #waktu { color: #f87171; }
        #skor { color: #fbbf24; }
        #peta {
            display: grid;
            gap: 1px;
            background: #444;
            margin: 0 auto;
            border: 3px solid #fff;
            width: fit-content;
        }
        .kotak {
            width: 22px;
            height: 22px;
            transition: 0.1s;
        }
        .dinding { background: #111; }
        .jalan { background: #86efac; }
        .pemain { background: #3b82f6; border-radius: 4px; }
        .tujuan { background: #fbbf24; border-radius: 4px; }
        button {
            margin: 12px 8px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-buat { background: #4ade80; }
        .btn-kontrol { background: #3b82f6; width: 60px; height: 60px; font-size: 22px; }
    </style>
</head>
<body>

    <h1>🗺️ Peta Acak & Labirin</h1>

    <div class="info-atas">
        <div>Waktu: <span id="waktu">60</span> dtk</div>
        <div>Skor: <span id="skor">0</span></div>
    </div>

    <button class="btn-buat" onclick="mulaiPermainan()">Mulai Permainan</button>
    <div id="peta"></div>

    <div style="margin-top:15px;">
        <button class="btn-kontrol" onclick="gerak('atas')">↑</button><br>
        <button class="btn-kontrol" onclick="gerak('kiri')">←</button>
        <button class="btn-kontrol" onclick="gerak('bawah')">↓</button>
        <button class="btn-kontrol" onclick="gerak('kanan')">→</button>
    </div>

    <script>
        const UKURAN = 15;
        let peta = [];
        let posPemain = {x:1, y:1};
        let posTujuan = {x:UKURAN-2, y:UKURAN-2};
        let sisaWaktu = 60;
        let skor = 0;
        let timerWaktu;
        let sedangMain = false;

        function mulaiPermainan() {
            bersihkanSemua();
            buatPetaBaru();
            mulaiHitungWaktu();
            sedangMain = true;
        }

        function bersihkanSemua() {
            clearInterval(timerWaktu);
            sisaWaktu = 60;
            document.getElementById('waktu').textContent = sisaWaktu;
        }

        function buatPetaBaru() {
            peta = Array(UKURAN).fill().map(() => Array(UKURAN).fill(1));
            let tumpukan = [{x:1, y:1}];
            peta[1][1] = 0;

            while(tumpukan.length > 0) {
                let sekarang = tumpukan.pop();
                let arah = kocok([[0,-2],[0,2],[-2,0],[2,0]]);
                for(let [dx, dy] of arah) {
                    let nx = sekarang.x + dx;
                    let ny = sekarang.y + dy;
                    if(nx > 0 && nx < UKURAN-1 && ny > 0 && ny < UKURAN-1 && peta[ny][nx] === 1) {
                        peta[ny][nx] = 0;
                        peta[sekarang.y + dy/2][sekarang.x + dx/2] = 0;
                        tumpukan.push({x:nx, y:ny});
                    }
                }
            }
            posPemain = {x:1, y:1};
            gambarPeta();
        }

        function gambarPeta() {
            const wadah = document.getElementById('peta');
            wadah.innerHTML = '';
            wadah.style.gridTemplateColumns = `repeat(${UKURAN}, auto)`;

            for(let y = 0; y < UKURAN; y++) {
                for(let x = 0; x < UKURAN; x++) {
                    const kotak = document.createElement('div');
                    kotak.classList.add('kotak');
                    if(x === posPemain.x && y === posPemain.y) {
                        kotak.classList.add('pemain');
                    } else if(x === posTujuan.x && y === posTujuan.y) {
                        kotak.classList.add('tujuan');
                    } else {
                        kotak.classList.add(peta[y][x] === 1 ? 'dinding' : 'jalan');
                    }
                    wadah.appendChild(kotak);
                }
            }
        }

        function gerak(arah) {
            if(!sedangMain) return;
            let nx = posPemain.x;
            let ny = posPemain.y;

            if(arah === 'atas') ny--;
            if(arah === 'bawah') ny++;
            if(arah === 'kiri') nx--;
            if(arah === 'kanan') nx++;

            if(nx >= 0 && nx < UKURAN && ny >= 0 && ny < UKURAN && peta[ny][nx] === 0) {
                posPemain = {x:nx, y:ny};
                gambarPeta();
                cekTujuan();
            }
        }

        function cekTujuan() {
            if(posPemain.x === posTujuan.x && posPemain.y === posTujuan.y) {
                clearInterval(timerWaktu);
                skor += sisaWaktu * 2;
                document.getElementById('skor').textContent = skor;
                alert(`🎉 Berhasil! Skor ditambah ${sisaWaktu * 2} poin`);
                sedangMain = false;
            }
        }

        function mulaiHitungWaktu() {
            timerWaktu = setInterval(() => {
                sisaWaktu--;
                document.getElementById('waktu').textContent = sisaWaktu;
                if(sisaWaktu <= 0) {
                    clearInterval(timerWaktu);
                    alert('⏱️ Waktu Habis! Coba lagi');
                    sedangMain = false;
                }
            }, 1000);
        }

        function kocok(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        document.addEventListener('keydown', e => {
            if(!sedangMain) return;
            if(e.key === 'ArrowUp') gerak('atas');
            if(e.key === 'ArrowDown') gerak('bawah');
            if(e.key === 'ArrowLeft') gerak('kiri');
            if(e.key === 'ArrowRight') gerak('kanan');
        });
    </script>
</body>
</html>
