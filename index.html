<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Digital Demo</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        :root { --utama:#2563eb; --hijau:#10b981; --merah:#ef4444; --kuning:#f59e0b; --abu:#64748b; }
        body { background:#f0f4f8; padding:20px; }
        .wadah { max-width:420px; margin:0 auto; background:white; border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,0.1); overflow:hidden; }
        .header { background:linear-gradient(135deg, var(--utama), #1d4ed8); color:white; padding:30px 20px; text-align:center; }
        .saldo { font-size:36px; font-weight:bold; margin:15px 0; }
        .info { font-size:14px; opacity:0.9; }
        .menu { display:grid; grid-template-columns:repeat(2, 1fr); gap:15px; padding:20px; }
        .tombol { border:none; border-radius:12px; padding:18px; font-size:16px; font-weight:bold; cursor:pointer; color:white; transition:0.2s; }
        .tombol.isi { background:var(--hijau); }
        .tombol.kirim { background:var(--utama); }
        .tombol.riwayat { background:var(--kuning); }
        .tombol.bantuan { background:var(--abu); }
        .bagian { padding:20px; border-top:1px solid #eee; display:none; }
        .bagian.aktif { display:block; }
        input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; font-size:16px; }
        .daftar-transaksi { margin-top:15px; max-height:250px; overflow-y:auto; }
        .item { padding:12px; border-radius:8px; margin:8px 0; background:#f8fafc; border-left:4px solid var(--utama); }
        .masuk { border-left-color:var(--hijau); }
        .keluar { border-left-color:var(--merah); }
    </style>
</head>
<body>
<div class="wadah">
    <div class="header">
        <h2>💳 Dompet Digital Demo</h2>
        <div class="saldo">Rp <span id="jumlahSaldo">0</span></div>
        <div class="info">Saldo Tersedia</div>
    </div>

    <div class="menu">
        <button class="tombol isi" onclick="bukaBagian('isi')">➕ Isi Saldo</button>
        <button class="tombol kirim" onclick="bukaBagian('kirim')">➡️ Kirim Uang</button>
        <button class="tombol riwayat" onclick="bukaBagian('riwayat')">📜 Riwayat</button>
        <button class="tombol bantuan" onclick="bukaBagian('info')">ℹ️ Info</button>
    </div>

    <div id="isi" class="bagian aktif">
        <h3>Isi Saldo</h3>
        <input type="number" id="nominalIsi" placeholder="Masukkan jumlah Rp">
        <button class="tombol isi" style="width:100%" onclick="isiSaldo()">Proses</button>
    </div>

    <div id="kirim" class="bagian">
        <h3>Kirim Uang</h3>
        <input type="text" id="tujuan" placeholder="Nomor / Nama Tujuan">
        <input type="number" id="nominalKirim" placeholder="Jumlah Rp">
        <button class="tombol kirim" style="width:100%" onclick="kirimUang()">Kirim Sekarang</button>
    </div>

    <div id="riwayat" class="bagian">
        <h3>Riwayat Transaksi</h3>
        <div id="daftarTransaksi" class="daftar-transaksi"></div>
    </div>

    <div id="info" class="bagian">
        <h3>Informasi</h3>
        <p>✅ Ini hanya simulasi/demo, tidak menggunakan uang asli.</p>
        <p>✅ Data tersimpan di HP kamu saja, aman dan pribadi.</p>
        <p>✅ Cocok untuk belajar tampilan dan alur dompet digital.</p>
    </div>
</div>

<script>
    let saldo = parseInt(localStorage.getItem('saldoDemo')) || 0;
    let riwayat = JSON.parse(localStorage.getItem('riwayatDemo')) || [];
    perbaruiTampilan();

    function bukaBagian(id) {
        document.querySelectorAll('.bagian').forEach(b => b.classList.remove('aktif'));
        document.getElementById(id).classList.add('aktif');
        if (id === 'riwayat') tampilkanRiwayat();
    }

    function perbaruiTampilan() {
        document.getElementById('jumlahSaldo').textContent = saldo.toLocaleString('id-ID');
        localStorage.setItem('saldoDemo', saldo);
        localStorage.setItem('riwayatDemo', JSON.stringify(riwayat));
    }

    function isiSaldo() {
        let nominal = parseInt(document.getElementById('nominalIsi').value);
        if (!nominal || nominal <= 0) return alert('Masukkan nominal yang benar!');
        saldo += nominal;
        riwayat.unshift({jenis:'masuk', keterangan:'Isi Saldo', jumlah:nominal, waktu:new Date().toLocaleString('id-ID')});
        perbaruiTampilan();
        alert(`Berhasil menambah Rp ${nominal.toLocaleString('id-ID')}`);
        document.getElementById('nominalIsi').value = '';
    }

    function kirimUang() {
        let tujuan = document.getElementById('tujuan').value.trim();
        let nominal = parseInt(document.getElementById('nominalKirim').value);
        if (!tujuan || !nominal || nominal <= 0) return alert('Lengkapi data dengan benar!');
        if (nominal > saldo) return alert('Saldo tidak cukup!');
        saldo -= nominal;
        riwayat.unshift({jenis:'keluar', keterangan:`Kirim ke: ${tujuan}`, jumlah:nominal, waktu:new Date().toLocaleString('id-ID')});
        perbaruiTampilan();
        alert(`Berhasil mengirim Rp ${nominal.toLocaleString('id-ID')}`);
        document.getElementById('tujuan').value = '';
        document.getElementById('nominalKirim').value = '';
    }

    function tampilkanRiwayat() {
        let html = '';
        riwayat.forEach(t => {
            html += `<div class="item ${t.jenis}">
                <strong>${t.keterangan}</strong><br>
                Rp ${t.jumlah.toLocaleString('id-ID')}<br>
                <small>${t.waktu}</small>
            </div>`;
        });
        document.getElementById('daftarTransaksi').innerHTML = html || '<p>Belum ada transaksi</p>';
    }
</script>
</body>
</html>
