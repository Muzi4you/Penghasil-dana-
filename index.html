<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Pesawat Tempur Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #050517;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            overflow: hidden;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 15px;
            color: #60a5fa;
            text-shadow: 0 0 25px rgba(96, 165, 250, 0.7);
            letter-spacing: 2px;
        }

        .info-bar {
            display: flex;
            gap: 35px;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
            padding: 10px 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        #skor { color: #fbbf24; }
        #nyawa { color: #ef4444; }
        #level { color: #34d399; }
        #rekor { color: #a78bfa; }

        #layar {
            width: 420px;
            height: 600px;
            background: linear-gradient(180deg, #0a0e27 0%, #121a3f 50%, #0a0e27 100%);
            border: 3px solid #60a5fa;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(96, 165, 250, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Bintang bergerak cepat */
        .bintang {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: jatuhBintang linear infinite;
        }
        @keyframes jatuhBintang {
            from { transform: translateY(-10px); }
            to { transform: translateY(610px); }
        }

        /* Awan bergerak */
        .awan {
            position: absolute;
            width: 120px;
            height: 60px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            animation: gerakAwan 25s linear infinite;
        }
        @keyframes gerakAwan {
            from { transform: translateY(-100px); }
            to { transform: translateY(700px); }
        }

        /* Pesawat Pemain */
        #pesawat {
            width: 50px;
            height: 60px;
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            position: absolute;
            bottom: 25px;
            left: 185px;
            border-radius: 8px 8px 2px 2px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
            clip-path: polygon(50% 0%, 100% 35%, 92% 100%, 65% 92%, 35% 92%, 8% 100%, 0% 35%);
            z-index: 10;
        }

        /* Asap Pesawat */
        .asap {
            position: absolute;
            width: 20px;
            height: 25px;
            background: radial-gradient(circle, #fbbf24, #ef4444, transparent);
            border-radius: 50%;
            animation: hilangAsap 0.4s ease-out forwards;
        }
        @keyframes hilangAsap {
            0% { transform: scale(0.6); opacity: 0.7; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Peluru */
        .peluru {
            width: 8px;
            height: 22px;
            background: linear-gradient(180deg, #fbbf24, #f59e0b);
            position: absolute;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.9);
        }

        /* Musuh Ringan */
        .musuh-biasa {
            width: 45px;
            height: 50px;
            background: linear-gradient(180deg, #ef4444, #991b1b);
            position: absolute;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
            clip-path: polygon(50% 100%, 100% 60%, 90% 0%, 60% 10%, 40% 10%, 10% 0%, 0% 60%);
        }

        /* Musuh Berat */
        .musuh-besar {
            width: 70px;
            height: 75px;
            background: linear-gradient(180deg, #dc2626, #7f1d1d);
            position: absolute;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.8);
            clip-path: polygon(50% 100%, 100% 55%, 95% 0%, 65% 8%, 35% 8%, 5% 0%, 0% 55%);
        }

        /* Item Bonus */
        .item-bonus {
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, #4ade80, #166534);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 18px rgba(74, 222, 128, 0.9);
            animation: berputar 2s linear infinite;
        }
        @keyframes berputar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Efek Ledakan */
        .ledakan {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #fbbf24, #ef4444, #991b1b, transparent);
            position: absolute;
            border-radius: 50%;
            animation: meledak 0.4s ease-out forwards;
            z-index: 20;
        }
        @keyframes meledak {
            0% { transform: scale(0.3); opacity: 1; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1.8); opacity: 0; }
        }

        #mulaiBtn {
            margin-top: 25px;
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #3b82f6, #1d4ed8);
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.5);
            transition: all 0.2s ease;
        }
        #mulaiBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        }

        .kontrol {
            margin-top: 30px;
            display: flex;
            gap: 30px;
        }
        .arah {
            width: 75px;
            height: 75px;
            font-size: 30px;
            font-weight: bold;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #34d399, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.5);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .arah:active {
            transform: scale(0.92);
        }

        #pesan {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            min-height: 35px;
        }
    </style>
</head>
<body>

    <h1>🚀 PESAWAT TEMBAK SUPER</h1>

    <div class="info-bar">
        <div>Skor: <span id="skor">0</span></div>
        <div>Nyawa: <span id="nyawa">3</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Rekor: <span id="rekor">0</span></div>
    </div>

    <div id="layar">
        <div id="pesawat"></div>
    </div>

    <button id="mulaiBtn">Mulai Permainan</button>
    <div id="pesan"></div>

    <div class="kontrol">
        <button class="arah" onclick="gerak('kiri')">←</button>
        <button class="arah" onclick="tembak()">🔫</button>
        <button class="arah" onclick="gerak('kanan')">→</button>
    </div>

    <script>
        const layar = document.getElementById('layar');
        const pesawat = document.getElementById('pesawat');
        const skorTampilan = document.getElementById('skor');
        const nyawaTampilan = document.getElementById('nyawa');
        const levelTampilan = document.getElementById('level');
        const rekorTampilan = document.getElementById('rekor');
        const mulaiBtn = document.getElementById('mulaiBtn');
        const pesan = document.getElementById('pesan');

        let posPesawat = 185;
        let skor = 0;
        let nyawa = 3;
        let level = 1;
        let kecepatanMusuh = 2.2;
        let kecepatanTembak = 550;
        let bisaTembak = true;
        let sedangMain = false;
        let intervalMusuh, intervalBintang, intervalAwan;

        // Ambil rekor dari penyimpanan
        let rekor = localStorage.getItem('rekorPesawatSuper') || 0;
        rekorTampilan.textContent = rekor;

        // Buat bintang latar
        function buatBintang() {
            const bintang = document.createElement('div');
            bintang.classList.add('bintang');
            const ukuran = Math.random() * 2 + 1;
            bintang.style.width = `${ukuran}px`;
            bintang.style.height = `${ukuran}px`;
            bintang.style.left = `${Math.random() * 420}px`;
            bintang.style.animationDuration = `${Math.random() * 2 + 1.5}s`;
            layar.appendChild(bintang);
            setTimeout(() => bintang.remove(), 3000);
        }

        // Buat awan
        function buatAwan() {
            const awan = document.createElement('div');
            awan.classList.add('awan');
            awan.style.left = `${Math.random() * 350}px`;
            awan.style.animationDuration = `${Math.random() * 10 + 20}s`;
            layar.appendChild(awan);
            setTimeout(() => awan.remove(), 25000);
        }

        // Buat asap pesawat
        function buatAsap() {
            const asap = document.createElement('div');
            asap.classList.add('asap');
            asap.style.left = `${posPesawat + 16}px`;
            asap.style.top = `560px`;
            layar.appendChild(asap);
            setTimeout(() => asap.remove(), 400);
        }

        // Gerakkan pesawat
        function gerak(arah) {
            if (!sedangMain) return;
            if (arah === 'kiri' && posPesawat > 12) posPesawat -= 18;
            if (arah === 'kanan' && posPesawat < 358) posPesawat += 18;
            pesawat.style.left = `${posPesawat}px`;
            buatAsap();
        }

        // Tembak peluru
        function tembak() {
            if (!sedangMain || !bisaTembak) return;
            bisaTembak = false;

            const peluru = document.createElement('div');
            peluru.classList.add('peluru');
            peluru.style.left = `${posPesawat + 21}px`;
            peluru.style.top = `535px`;
            layar.appendChild(peluru);

            let posPeluru = 535;
            const gerakPeluru = setInterval(() => {
                posPeluru -= 12;
                peluru.style.top = `${posPeluru}px`;
                if (posPeluru < -20) {
                    clearInterval(gerakPeluru);
                    peluru.remove();
                }
                cekTabrakan(peluru);
            }, 20);

            setTimeout(() => bisaTembak = true, kecepatanTembak);
        }

        // Buat musuh acak
        function buatMusuh() {
            if (!sedangMain) return;
            const tipe = Math.random() < 0.2 ? 'besar' : 'biasa';
            const musuh = document.createElement('div');
            
            if (tipe === 'besar') {
                musuh.classList.add('musuh-besar');
                musuh.poin = 30;
                musuh.nyawa = 3;
            } else {
                musuh.classList.add('musuh-biasa');
                musuh.poin = 10;
                musuh.nyawa = 1;
            }

            const posX = Math.random() * (tipe === 'besar' ? 350 : 375);
            musuh.style.left = `${posX}px`;
            musuh.style.top = `-70px`;
            layar.appendChild(musuh);

            let posY = -70;
            const gerakMusuh = setInterval(() => {
                posY += kecepatanMusuh;
                musuh.style.top = `${posY}px`;

                if (posY > 620) {
                    clearInterval(gerakMusuh);
                    musuh.remove();
                    if (tipe === 'biasa') kurangiNyawa();
                }

                // Tabrakan dengan pesawat
                if (posY > 530 && Math.abs(posPesawat - posX) < (tipe === 'besar' ? 50 : 35)) {
                    clearInterval(gerakMusuh);
                    musuh.remove();
                    efekLedakan(posPesawat + 25, 560);
                    kurangiNyawa();
                }
            }, 25);
        }

        // Buat item bonus
        function buatBonus() {
            if (!sedangMain) return;
            const bonus = document.createElement('div');
            bonus.classList.add('item-bonus');
            const posX = Math.random() * 385;
            bonus.style.left = `${posX}px`;
            bonus.style.top = `-50px`;
            layar.appendChild(bonus);

            let posY = -50;
            const gerakBonus = setInterval(() => {
                posY += 1.8;
                bonus.style.top = `${posY}px`;

                if (posY > 620) {
                    clearInterval(gerakBonus);
                    bonus.remove();
                }

                // Ambil bonus
                if (posY > 530 && posY < 580 && Math.abs(posPesawat - posX) < 25) {
                    clearInterval(gerakBonus);
                    bonus.remove();
                    efekLedakan(posX + 17, posY + 17);
                    tambahNyawa();
                }
            }, 25);
        }

        // Cek tabrakan
        function cekTabrakan(peluru) {
            const musuhList = document.querySelectorAll('.musuh-biasa, .musuh-besar');
            musuhList.forEach(musuh => {
                const posMX = parseInt(musuh.style.left);
                const posMY = parseInt(musuh.style.top);
                const posPX = parseInt(peluru.style.left);
                const posPY = parseInt(peluru.style.top);
                const lebar = musuh.classList.contains('musuh-besar') ? 70 : 45;

                if (
                    posPY < posMY + lebar &&
                    posPY > posMY &&
                    posPX > posMX &&
                    posPX < posMX + lebar
                ) {
                    peluru.remove();
                    musuh.nyawa--;
                    if (musuh.nyawa <= 0) {
                        musuh.remove();
                        efekLedakan(posMX + lebar/2, posMY + lebar/2);
                        tambahSkor(musuh.poin);
                    }
                }
            });
        }

        // Efek ledakan
        function efekLedakan(x, y) {
            const ledakan = document.createElement('div');
            ledakan.classList.add('ledakan');
            ledakan.style.left = `${x - 30}px`;
            ledakan.style.top = `${y - 30}px`;
            layar.appendChild(ledakan);
            setTimeout(() => ledakan.remove(), 400);
        }

        // Tambah skor & naik level
        function tambahSkor(jumlah) {
            skor += jumlah;
            skorTampilan.textContent = skor;
            if (skor % 150 === 0 && kecepatanMusuh < 7) {
                level++;
                kecepatanMusuh += 0.4;
                kecepatanTembak = Math.max(180, kecepatanTembak - 40);
                levelTampilan.textContent = level;
                pesan.textContent = `🔥 LEVEL ${level}! Semakin Menantang!`;
                setTimeout(() => pesan.textContent = '', 2000);
            }
            if (Math.random() < 0.08) buatBonus();
        }

        function tambahNyawa() {
            nyawa = Math.min(5, nyawa + 1);
            nyawaTampilan.textContent = nyawa;
            pesan.textContent = `❤️ Nyawa Bertambah!`;
            setTimeout(() => pesan.textContent = '', 1500);
        }

        function kurangiNyawa() {
            nyawa--;
            nyawaTampilan.textContent = nyawa;
            if (nyawa <= 0) gameSelesai();
        }

        // Mulai permainan
        function mulaiPermainan() {
            bersihkanLayar();
            posPesawat = 185;
            skor = 0;
            nyawa = 3;
            level = 1;
            kecepatanMusuh = 2.2;
            kecepatanTembak = 550;
            skorTampilan.textContent = skor;
            nyawaTampilan.textContent = nyawa;
            levelTampilan.textContent = level;
            pesan.textContent = '';
            sedangMain = true;
            mulaiBtn.textContent = 'Sedang Bermain';

            intervalBintang = setInterval(buatBintang, 100);
            intervalAwan = setInterval(buatAwan, 4000);
            intervalMusuh = setInterval(buatMusuh, 750);
        }

        // Selesai permainan
        function gameSelesai() {
            clearInterval(intervalMusuh);
            clearInterval(intervalBintang);
            clearInterval(intervalAwan);
            sedangMain = false;
            mulaiBtn.textContent = 'Main Lagi';
            
            if (skor > rekor) {
                rekor = skor;
                localStorage.setItem('rekorPesawatSuper', rekor);
                rekorTampilan.textContent = rekor;
                pesan.textContent = `🎉 REKOR BARU! Skor: ${skor}`;
            } else {
                pesan.textContent = `💥 Game Over! Skor: ${skor}`;
            }
        }

        function bersihkanLayar() {
            document.querySelectorAll('.musuh-biasa, .musuh-besar, .peluru, .ledakan, .bintang, .awan, .item-bonus, .asap').forEach(el => el.remove());
        }

        // Kontrol keyboard
        document.addEventListener('keydown', (e) => {
            if (!sedangMain) return;
            if (e.key === 'ArrowLeft') gerak('kiri');
            if (e.key === 'ArrowRight') gerak('kanan');
            if (e.key === ' ' || e.key === 'ArrowUp') tembak();
        });

        mulaiBtn.addEventListener('click', mulaiPermainan);
    </script>
</body>
</html>
